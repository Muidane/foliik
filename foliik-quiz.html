<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>foliik — le quiz de la marée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --clay:#a8552e;
    --clay-deep:#6f3015;
    --tide:#1f7a72;
    --tide-deep:#0c4742;
    --sand:#f3ecd9;
    --sand-deep:#e3d4ad;
    --foam:#fffaf0;
    --coral:#d9583a;
    --success:#1f9e85;
    --ink:#2e2a22;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #fff7e6 0%, transparent 60%),
      linear-gradient(180deg, var(--sand) 0%, var(--sand) 45%, #dfe9e2 100%);
    color:var(--ink);
    font-family:"Work Sans", system-ui, sans-serif;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  h1,h2,h3,.display{ font-family:"Fraunces", Georgia, serif; }
  .wrap{ width:100%; max-width:640px; }

  /* ---------- shared bits ---------- */
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:0.72rem;
    font-weight:600;
    color:var(--tide-deep);
  }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible{ outline:3px solid var(--tide); outline-offset:2px; }
  .screen{ display:none; }
  .screen.active{ display:block; }

  /* ---------- start screen ---------- */
  .hero{ text-align:center; margin-bottom:8px; }
  .hero .title{
    font-size:3rem;
    font-weight:600;
    color:var(--clay);
    letter-spacing:0.01em;
    margin:6px 0 2px;
  }
  .hero .subtitle{
    font-size:1.05rem;
    color:var(--tide-deep);
    margin:0 0 4px;
  }
  .horizon{
    position:relative;
    height:46px;
    margin:18px 0 22px;
    border-radius:10px;
    overflow:hidden;
    background:linear-gradient(180deg, var(--sand-deep) 0%, var(--sand-deep) 55%, var(--tide) 55%, var(--tide-deep) 100%);
  }
  .horizon::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(100deg, rgba(255,255,255,0.18) 0 8px, transparent 8px 26px);
    opacity:0.5;
    top:55%;
    height:45%;
  }

  .levels{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:8px;
  }
  .level-tile{
    background:var(--foam);
    border:1px solid var(--sand-deep);
    border-radius:12px;
    padding:14px 14px 12px;
    text-align:left;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    box-shadow:0 1px 2px rgba(15,60,55,0.06);
  }
  .level-tile:hover{ transform:translateY(-2px); box-shadow:0 6px 14px rgba(15,60,55,0.12); border-color:var(--tide); }
  .level-tile .num{
    font-family:"Fraunces", serif;
    font-size:1.3rem;
    color:var(--clay);
    font-weight:600;
  }
  .level-tile .label{
    font-weight:600;
    font-size:0.92rem;
    margin:2px 0 2px;
    color:var(--ink);
  }
  .level-tile .theme{
    font-size:0.78rem;
    color:#5c6f6a;
  }
  .level-tile.final{
    grid-column:1 / -1;
    background:linear-gradient(120deg, var(--tide) 0%, var(--tide-deep) 100%);
    border-color:var(--tide-deep);
  }
  .level-tile.final .num, .level-tile.final .label{ color:#fff; }
  .level-tile.final .theme{ color:#d8efe9; }

  /* ---------- quiz screen ---------- */
  .quiz-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .back-btn{
    background:none; border:none; color:var(--tide-deep);
    font-size:0.85rem; font-weight:600; padding:6px 0;
  }
  .score-pill{
    background:var(--foam); border:1px solid var(--sand-deep);
    border-radius:999px; padding:5px 14px; font-size:0.85rem; font-weight:600;
    color:var(--clay-deep);
  }

  .shoreline{
    position:relative;
    height:14px;
    background:var(--sand-deep);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .shoreline .fill{
    position:absolute; left:0; top:0; bottom:0;
    width:0%;
    background:linear-gradient(90deg, var(--tide) 0%, var(--tide-deep) 100%);
    transition:width .5s ease;
    border-radius:999px;
  }
  .shoreline .boat{
    position:absolute; top:-13px; left:0%;
    transform:translateX(-50%);
    transition:left .5s ease;
    font-size:1.1rem;
    line-height:1;
  }

  .card{
    background:var(--foam);
    border:1px solid var(--sand-deep);
    border-radius:16px;
    padding:26px 24px;
    box-shadow:0 2px 10px rgba(15,60,55,0.08);
  }
  .q-eyebrow{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .q-text{
    font-size:1.18rem;
    font-weight:600;
    line-height:1.4;
    margin:0 0 18px;
    color:var(--ink);
  }
  .options{
    display:grid;
    gap:10px;
  }
  .opt{
    text-align:left;
    background:#fff;
    border:1.5px solid var(--sand-deep);
    border-radius:10px;
    padding:13px 16px;
    font-size:1rem;
    font-weight:500;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover:not(:disabled){ border-color:var(--tide); background:#f6fbf9; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:#e3f6f0; border-color:var(--success); color:var(--tide-deep); }
  .opt.incorrect{ background:#fbe9e4; border-color:var(--coral); color:var(--clay-deep); }
  .opt.reveal{ background:#e3f6f0; border-color:var(--success); }

  .feedback{
    margin-top:18px;
    padding:14px 16px;
    border-radius:10px;
    font-size:0.92rem;
    line-height:1.5;
    display:none;
  }
  .feedback.show{ display:block; animation:rise .25s ease; }
  .feedback.good{ background:#e3f6f0; border-left:4px solid var(--success); color:var(--tide-deep); }
  .feedback.bad{ background:#fbe9e4; border-left:4px solid var(--coral); color:var(--clay-deep); }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .continue-btn{
    margin-top:16px;
    width:100%;
    background:var(--clay);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:13px;
    font-size:0.98rem;
    font-weight:600;
    display:none;
  }
  .continue-btn.show{ display:block; }
  .continue-btn:hover{ background:var(--clay-deep); }

  .streak{
    font-size:0.78rem;
    color:var(--clay-deep);
    font-weight:600;
  }

  /* ---------- end screen ---------- */
  .end-card{
    text-align:center;
    background:var(--foam);
    border:1px solid var(--sand-deep);
    border-radius:16px;
    padding:36px 26px;
  }
  .end-rank{
    font-size:1.7rem;
    font-weight:700;
    color:var(--clay);
    margin:6px 0 4px;
  }
  .end-score{
    font-size:1rem;
    color:var(--tide-deep);
    margin-bottom:18px;
  }
  .end-note{ font-size:0.92rem; color:#5c6f6a; margin-bottom:24px; line-height:1.5; }
  .end-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn-secondary, .btn-primary{
    border:none; border-radius:10px; padding:12px 20px; font-weight:600; font-size:0.92rem;
  }
  .btn-primary{ background:var(--tide); color:#fff; }
  .btn-primary:hover{ background:var(--tide-deep); }
  .btn-secondary{ background:#fff; border:1.5px solid var(--sand-deep); color:var(--ink); }
  .btn-secondary:hover{ border-color:var(--clay); }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (max-width:480px){
    .levels{ grid-template-columns:1fr; }
    .hero .title{ font-size:2.3rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- START SCREEN -->
  <section class="screen active" id="screen-start">
    <div class="hero">
      <p class="eyebrow">Apprendre en s'amusant</p>
      <h1 class="title">foliik</h1>
      <p class="subtitle">un petit quiz pour piger fo- sans se prendre la tête</p>
    </div>
    <div class="horizon" aria-hidden="true"></div>
    <p class="eyebrow" style="margin-bottom:10px;">Par où on commence ?</p>
    <div class="levels" id="level-grid"></div>
  </section>

  <!-- QUIZ SCREEN -->
  <section class="screen" id="screen-quiz">
    <div class="quiz-header">
      <button class="back-btn" id="back-btn">← Je change de niveau</button>
      <span class="score-pill" id="score-pill">0 / 0</span>
    </div>
    <div class="shoreline">
      <div class="fill" id="shoreline-fill"></div>
      <div class="boat" id="shoreline-boat">⛵</div>
    </div>
    <div class="card">
      <div class="q-eyebrow">
        <span class="eyebrow" id="q-level-label">Niveau</span>
        <span class="streak" id="streak-label"></span>
      </div>
      <p class="q-text" id="q-text"></p>
      <div class="options" id="q-options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="continue-btn" id="continue-btn">Suivant</button>
    </div>
  </section>

  <!-- END SCREEN -->
  <section class="screen" id="screen-end">
    <div class="end-card">
      <p class="eyebrow">C'est fini pour cette marée</p>
      <p class="end-rank" id="end-rank"></p>
      <p class="end-score" id="end-score"></p>
      <p class="end-note" id="end-note"></p>
      <div class="end-actions">
        <button class="btn-secondary" id="retry-btn">Je retente !</button>
        <button class="btn-primary" id="choose-btn">Changer de niveau</button>
      </div>
    </div>
  </section>

</div>

<script>
// ---------- question bank ----------
// Each item: { level, q, opts:[...], a: index of correct option, ex: explanation }
const BANK = [
  // NIVEAU 1 — le vocabulaire de base
  {level:1, q:"« foliik », ça veut dire quoi ?", opts:["un truc, quelque chose (la première fois qu'on en parle)","cette chose-ci, là","y'en a","des trucs, plusieurs"], a:0, ex:"foliik sert à parler d'un truc dont on n'a PAS encore parlé avant."},
  {level:1, q:"« fo- », c'est :", opts:["la version longue de foliik","la version courte de foliik, pour un truc dont on a DÉJÀ parlé","un chiffre pour le duel","un mot pour dire 'en haut'"], a:1, ex:"fo- remplace foliik dès que tout le monde sait déjà de quoi on parle."},
  {level:1, q:"Vrai ou faux : on utilise « foliik » pour un truc dont on a déjà parlé avant.", opts:["Vrai","Faux"], a:1, ex:"Non, c'est l'inverse ! foliik = la toute première fois qu'on en parle."},
  {level:1, q:"La version « K » (un autre dialecte) de foliik, c'est :", opts:["wobai","pholiik","fooxo","ma(h)lileny"], a:1, ex:"Le dico le dit : foliik (P) = pholiik (K), même mot, deux façons de parler."},
  {level:1, q:"« kia fo na tuuli », ça veut dire :", opts:["parce que je n'ai rien trouvé","qu'est-ce qu'elle a dit, cette femme ?","ils font ça","y'en a"], a:0, ex:"Une phrase toute faite, donnée comme exemple — à retenir telle quelle."},
  {level:1, q:"La version « K » de fo-, c'est :", opts:["pho-","foli-","mahli-","bai-"], a:0, ex:"fo- (P) = pho- (K)."},

  // NIVEAU 2 — c'est proche ou c'est loin ?
  {level:2, q:"« cette chose-ci », celle qui est juste là, à côté de toi :", opts:["foleny","fooxi","foaida","fomaidu"], a:0, ex:"foleny = tout près de toi."},
  {level:2, q:"« cette chose-là, au loin » :", opts:["foona","fooxi","fobai","fowo"], a:1, ex:"fooxi = loin, là-bas."},
  {level:2, q:"Vrai ou faux : foleny et fooxi parlent de la même distance.", opts:["Vrai","Faux"], a:1, ex:"Pas du tout, c'est même le contraire : l'un est proche, l'autre loin."},
  {level:2, q:"La version longue de foleny :", opts:["foliixeny","foliixena","foliixexi","foliixaida"], a:0, ex:"foliik hleny / foliix-eny — même forme, version longue."},
  {level:2, q:"La version longue de fooxi :", opts:["foliixaida","foliixexi","foliik maidu","foliixeli"], a:1, ex:"foliixexi = fooxi, en plus long."},
  {level:2, q:"« foona », ça sert à :", opts:["reprendre un truc déjà mentionné avant","montrer un truc qui est là, devant toi","indiquer une direction","dire qu'il y en a"], a:1, ex:"foona pointe vers ce que tu as sous les yeux, là, maintenant."},

  // NIVEAU 3 — reprendre ce qu'on a déjà dit
  {level:3, q:"Reprendre un truc dont on a DÉJÀ parlé juste avant, ça s'appelle :", opts:["pointer du doigt","une reprise (anaphore)","une direction","une quantité"], a:1, ex:"Ex : « J'ai vu une maison. Cette maison est grande. » → on reparle de la même maison."},
  {level:3, q:"« fooli » sert à :", opts:["montrer un truc qui est juste là","reprendre un truc déjà mentionné","indiquer une direction","dire qu'il y en a"], a:1, ex:"fooli reprend un truc dont on vient de parler."},
  {level:3, q:"« hla u diya fobai » veut dire :", opts:["ils font ça","le coq n'a rien fait","qu'est-ce qu'elle a dit, celle-là ?","y'avait du travail"], a:0, ex:"Exemple tout fait, donné dans le dico."},
  {level:3, q:"« fobai » a un petit truc en plus, il dit aussi que c'est :", opts:["en hauteur","« de ce genre-là », une catégorie de truc","plusieurs trucs","la première fois qu'on en parle"], a:1, ex:"Les exemples parlent de 'ce genre de femmes', 'ce genre de maisons' — fobai range le truc dans une catégorie."},
  {level:3, q:"Vrai ou faux : fobai se construit à partir de foliik (la version longue), pas de fo-.", opts:["Vrai","Faux"], a:0, ex:"C'est marqué noir sur blanc dans le dico : foliik + bai."},
  {level:3, q:"La version longue de fooli :", opts:["foliixeli","foliixena","foliixaida","foliik maidu"], a:0, ex:"foliixeli, c'est fooli en version longue."},

  // NIVEAU 4 — en haut ou en bas ?
  {level:4, q:"« cette chose-là, en haut » :", opts:["fomaidu","foaida","fooxi","fowo"], a:1, ex:"foaida pointe vers le haut."},
  {level:4, q:"« cette chose-là, en bas » :", opts:["fomaidu","foaida","foona","fobai"], a:0, ex:"fomaidu pointe vers le bas."},
  {level:4, q:"La version longue de foaida :", opts:["foliixaida","foliik maidu","foliixena","foliixeli"], a:0, ex:"foliixaida = foaida, en plus long."},
  {level:4, q:"La version longue de fomaidu :", opts:["foliixaida","foliik maidu","foliixexi","foliixali"], a:1, ex:"foliik maidu = fomaidu, en plus long."},
  {level:4, q:"Vrai ou faux : foaida et fomaidu, c'est haut contre bas.", opts:["Vrai","Faux"], a:0, ex:"Exactement, les deux font la paire sur l'axe vertical."},

  // NIVEAU 5 — y'en a, ou on sait pas trop ?
  {level:5, q:"« y'en a » (ça existe, il y en a) :", opts:["fowo","fooxo","fooli","foaida"], a:0, ex:"fowo dit juste qu'il y en a, sans préciser quoi."},
  {level:5, q:"« un truc, mais on sait pas trop lequel » :", opts:["fowo","fooxo","fobai","foona"], a:1, ex:"fooxo, c'est flou, vague, pas précis."},
  {level:5, q:"Vrai ou faux : fooxo désigne un truc bien précis, qu'on connaît déjà.", opts:["Vrai","Faux"], a:1, ex:"Non, c'est tout le contraire : fooxo sert justement quand c'est flou."},
  {level:5, q:"« kia shaya fo (=fooxo) hâ tuuli » veut dire :", opts:["y'avait pas de travail à trouver","le coq n'a rien fait","ils font ça","c'est en haut"], a:0, ex:"Exemple du dico — ici fo renvoie à un truc vague, éventuel."},

  // NIVEAU 6 — la première fois, ou on connaît déjà ?
  {level:6, q:"La toute première fois qu'on parle d'un truc, on utilise :", opts:["la version courte","la version longue, avec foliik","le duel","le pluriel"], a:1, ex:"La version longue sert à présenter un truc tout neuf dans la conversation."},
  {level:6, q:"La version courte qui correspond à foliixeli :", opts:["fooli","foona","foaida","fowo"], a:0, ex:"foliixeli (longue) ↔ fooli (courte), même sens."},
  {level:6, q:"La version longue qui correspond à fobai :", opts:["foliik bai","foliixena","foliixaida","foliik maidu"], a:0, ex:"foliik bai (longue) ↔ fobai (courte)."},
  {level:6, q:"Vrai ou faux : une fois qu'on connaît le truc, on peut garder la version longue tout le temps, ça change rien.", opts:["Vrai","Faux"], a:1, ex:"Non ! Une fois que c'est connu, on passe à la version courte — c'est tout le système."},

  // NIVEAU 7 — on décortique les mots
  {level:7, q:"foleny, si on le découpe en deux morceaux :", opts:["fo- + leny","fo- + hleny","foliik + leny","fo- + bai"], a:1, ex:"Le dico le dit : foliik + hleny."},
  {level:7, q:"fobai, si on le découpe :", opts:["fo- + bai","foliik + bai","fooxo + bai","fo- + eli"], a:1, ex:"Le dico le dit : foliik + bai."},
  {level:7, q:"fooli, si on le découpe :", opts:["fo- + eli","fo- + oli","foliik + eli","fo- + ena"], a:0, ex:"fooli = fo- + eli."},
  {level:7, q:"foona, si on le découpe :", opts:["fo- + ena","fo- + ona","foliik + ena","fo- + eli"], a:0, ex:"foona = fo- + ena."},
  {level:7, q:"Vrai ou faux : on sait exactement comment se découpe fooxo.", opts:["Vrai","Faux"], a:1, ex:"Pas du tout — le dico ne le précise pas, donc on n'invente rien et on laisse la question ouverte."},

  // NIVEAU 8 — quand on parle de DEUX trucs
  {level:8, q:"« ces deux choses-ci », celles qui sont juste là :", opts:["foliik ma(h)lileny","foliik ma(h)liina","foliik ma(h)laaleny","foliik ma(h)leena"], a:0, ex:"Le duel, version proche : ma(h)lileny."},
  {level:8, q:"« ces deux choses-là », au loin :", opts:["foliik ma(h)lileny","foliik ma(h)liina","foliik ma(h)laaleny","foliik ma(h)leena"], a:1, ex:"Le duel, version loin : ma(h)liina."},
  {level:8, q:"Vrai ou faux : y'a une version courte pour parler de deux trucs (le duel).", opts:["Vrai","Faux"], a:1, ex:"Non — pour le duel, on n'a que des versions longues, avec foliik, dans les données."},

  // NIVEAU 9 — quand on parle de PLEIN de trucs
  {level:9, q:"« ces choses-ci », plusieurs, juste là :", opts:["foliik ma(h)lileny","foliik ma(h)laaleny","foliik ma(h)liina","foliik ma(h)leena"], a:1, ex:"Le pluriel, version proche : ma(h)laaleny."},
  {level:9, q:"« ces choses-là », plusieurs, au loin :", opts:["foliik ma(h)laaleny","foliik ma(h)leena","foliik ma(h)lileny","foliik ma(h)liina"], a:1, ex:"Le pluriel, version loin : ma(h)leena."},
  {level:9, q:"Vrai ou faux : ma(h)la- c'est pour le pluriel, et ma(h)li- c'est pour le duel.", opts:["Vrai","Faux"], a:0, ex:"Exactement ce qu'on observe dans les données."},

  // NIVEAU 10 — le grand mélange
  {level:10, q:"Lequel de ces mots reprend un truc déjà connu ET le classe dans une catégorie ?", opts:["foleny","fobai","foaida","fowo"], a:1, ex:"fobai = « de ce genre-là » : il reprend ET classe."},
  {level:10, q:"« foliik », ça sert à :", opts:["parler d'un truc pour la première fois","reprendre un truc déjà connu","le duel, seulement","le pluriel, seulement"], a:0, ex:"C'est la règle de base de tout le système."},
  {level:10, q:"Pour quel cas n'a-t-on AUCUNE version courte dans les données ?", opts:["le singulier","le duel et le pluriel","les mots qui reprennent un truc connu","les mots qui montrent un truc devant toi"], a:1, ex:"Seules des versions longues, avec foliik, existent pour le duel et le pluriel dans le corpus."},
];

const LEVEL_INFO = [
  {n:1,  label:"Les bases",                  theme:"foliik / fo-, c'est quoi ?"},
  {n:2,  label:"Proche ou loin ?",            theme:"foleny, foona, fooxi…"},
  {n:3,  label:"On reprend ce qu'on a dit",   theme:"fooli, fobai"},
  {n:4,  label:"En haut ou en bas ?",         theme:"foaida, fomaidu"},
  {n:5,  label:"Y'en a, ou on sait pas trop", theme:"fowo, fooxo"},
  {n:6,  label:"Première fois ou déjà connu", theme:"foliik ↔ fo-"},
  {n:7,  label:"On décortique les mots",      theme:"racine + petit bout collé"},
  {n:8,  label:"Quand on parle de DEUX trucs",theme:"ces deux choses…"},
  {n:9,  label:"Quand on parle de PLEIN de trucs", theme:"ces choses…"},
  {n:10, label:"Le grand mélange",            theme:"un peu de tout, dans le désordre", final:true},
];

// ---------- state ----------
let currentLevel = null;
let queue = [];
let qIndex = 0;
let score = 0;
let streak = 0;
let answered = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ---------- render start screen ----------
const grid = document.getElementById('level-grid');
LEVEL_INFO.forEach(info=>{
  const tile = document.createElement('button');
  tile.className = 'level-tile' + (info.final ? ' final':'');
  tile.innerHTML = `<div class="num">${info.final ? '🌊' : 'Niveau '+info.n}</div>
                     <div class="label">${info.label}</div>
                     <div class="theme">${info.theme}</div>`;
  tile.addEventListener('click', ()=>startLevel(info.n));
  grid.appendChild(tile);
});

function startLevel(n){
  currentLevel = n;
  if(n === 10){
    queue = shuffle(BANK).slice(0, 16);
  } else {
    queue = shuffle(BANK.filter(item=>item.level===n));
  }
  qIndex = 0; score = 0; streak = 0; answered = false;
  show('screen-quiz');
  renderQuestion();
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('back-btn').addEventListener('click', ()=> show('screen-start'));
document.getElementById('choose-btn').addEventListener('click', ()=> show('screen-start'));
document.getElementById('retry-btn').addEventListener('click', ()=> startLevel(currentLevel));

function updateShoreline(){
  const pct = queue.length ? Math.round((qIndex / queue.length) * 100) : 0;
  document.getElementById('shoreline-fill').style.width = pct + '%';
  document.getElementById('shoreline-boat').style.left = pct + '%';
}

function renderQuestion(){
  answered = false;
  const item = queue[qIndex];
  document.getElementById('q-level-label').textContent =
    (currentLevel===10 ? 'Le grand mélange' : 'Niveau '+currentLevel) + ' — question ' + (qIndex+1) + '/' + queue.length;
  document.getElementById('streak-label').textContent = streak>1 ? ('🔥 '+streak+' à la suite !') : '';
  document.getElementById('score-pill').textContent = score + ' / ' + queue.length;
  document.getElementById('q-text').textContent = item.q;

  const optsWrap = document.getElementById('q-options');
  optsWrap.innerHTML = '';
  item.opts.forEach((opt, i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.addEventListener('click', ()=> selectOption(i));
    optsWrap.appendChild(b);
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';
  document.getElementById('continue-btn').classList.remove('show');
  updateShoreline();
}

function selectOption(i){
  if(answered) return;
  answered = true;
  const item = queue[qIndex];
  const buttons = document.querySelectorAll('#q-options .opt');
  buttons.forEach(b=>b.disabled = true);

  const correct = (i === item.a);
  buttons[i].classList.add(correct ? 'correct' : 'incorrect');
  if(!correct) buttons[item.a].classList.add('reveal');

  if(correct){ score++; streak++; } else { streak = 0; }

  const fb = document.getElementById('feedback');
  fb.classList.add('show', correct ? 'good' : 'bad');
  fb.textContent = (correct ? '✓ Yes, exactement ! — ' : '✗ Presque, regarde plutôt — ') + item.ex;

  document.getElementById('score-pill').textContent = score + ' / ' + queue.length;
  document.getElementById('streak-label').textContent = streak>1 ? ('🔥 '+streak+' à la suite !') : '';

  const cont = document.getElementById('continue-btn');
  cont.textContent = (qIndex === queue.length - 1) ? 'Voir mon score' : 'Suivant';
  cont.classList.add('show');
}

document.getElementById('continue-btn').addEventListener('click', ()=>{
  qIndex++;
  if(qIndex >= queue.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
});

function finishQuiz(){
  updateShoreline();
  const pct = Math.round((score/queue.length)*100);
  let rank, note;
  if(pct >= 90){ rank = "Capitaine des marées"; note = "Tu gères le truc à fond, de la première fois qu'on en parle jusqu'au pluriel. Y'a juste deux ou trois mystères que même le dico n'explique pas !"; }
  else if(pct >= 70){ rank = "Navigateur confirmé"; note = "Tu maîtrises bien la chose. Encore un petit tour côté duel et pluriel et c'est dans la poche."; }
  else if(pct >= 50){ rank = "Matelot en formation"; note = "Ça commence à rentrer ! Refais ce niveau pour bien fixer les formes qui coincent encore."; }
  else { rank = "Premiers pas sur le sable"; note = "Pas de souci, on refait un tour. Ça va vite venir, promis."; }

  document.getElementById('end-rank').textContent = rank;
  document.getElementById('end-score').textContent = score + ' / ' + queue.length + ' bonnes réponses (' + pct + ' %)';
  document.getElementById('end-note').textContent = note;
  show('screen-end');
}
</script>
</body>
</html>
